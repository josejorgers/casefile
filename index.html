<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casefile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23c0392b%22/></svg>">
</head>
<body>
  <header id="topbar">
    <div class="brand">CASEFILE</div>
    <div id="caseTitle"></div>
    <div class="spacer"></div>
    <button data-act="new-city" class="ghost">New city</button>
  </header>
  <div id="main">
    <aside id="left">
      <nav class="tabs">
        <button data-act="tab" data-tab="location" class="on">Location</button>
        <button data-act="tab" data-tab="directory">Directory</button>
        <button data-act="tab" data-tab="report">Case report</button>
        <button data-act="tab" data-tab="help">Help</button>
      </nav>
      <div id="tab-location" class="tab"></div>
      <div id="tab-directory" class="tab" hidden>
        <input id="dirQuery" type="search" placeholder="Search a name, business or phone number…" autocomplete="off">
        <div id="dirResults"></div>
      </div>
      <div id="tab-report" class="tab" hidden></div>
      <div id="tab-help" class="tab" hidden></div>
    </aside>
    <section id="boardWrap">
      <div id="boardToolbar">
        <button data-act="add-note">+ Note</button>
        <button data-act="add-unknown">+ Unknown person</button>
        <button data-act="center">Center</button>
        <span class="hint">Drag cards · Shift-click to link/unlink · Click a string to cut it · Scroll to zoom</span>
        <div class="spacer"></div>
        <button data-act="clear-board" class="ghost">Clear board</button>
      </div>
      <div id="board"><div id="boardInner"><svg id="links" width="10000" height="10000"></svg></div></div>
      <div id="inspector" hidden></div>
    </section>
  </div>
  <div id="modal" hidden><div class="modal-box"><button class="close" data-act="close-modal">×</button><div id="modalContent"></div></div></div>
  <div id="toast"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
